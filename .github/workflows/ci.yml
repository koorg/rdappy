name: Validation FR

on:
  push:
    branches: [fr]
    tags: ["fr-v*"]
  pull_request:
    branches: [fr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Retrieve the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" . -- --no-checkout --filter=blob:none
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - name: Runtime
        run: python --version
      - name: Offline tests
        run: python -B -m unittest discover -s tests -v
      - name: Command-line interface
        run: |
          python -B -m rdappy --version
          python -B -m rdappy --help

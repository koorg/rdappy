[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rdappy"
version = "1.0.1"
description = "A single-file RDAP command-line client with no runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "Artistic-1.0-Perl"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "koorg"}]
keywords = ["rdap", "whois", "domain", "ip", "asn", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
rdappy = "rdappy:cli"

[project.urls]
Repository = "https://github.com/koorg/rdappy"
Documentation = "https://github.com/koorg/rdappy#readme"
Issues = "https://github.com/koorg/rdappy/issues"

[tool.setuptools]
py-modules = ["rdappy"]

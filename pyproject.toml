[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rdappy"
version = "1.1.1"
description = "Client RDAP en français, en un seul fichier Python et sans dépendance à l’exécution."
readme = "README.md"
requires-python = ">=3.10"
license = "Artistic-1.0-Perl AND BSD-2-Clause"
license-files = ["LICENSE", "LICENSES/BSD-2-Clause.txt", "NOTICE"]
authors = [{name = "koorg"}]
keywords = ["rdap", "whois", "domain", "ip", "asn", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
rdappy = "rdappy:cli"

[project.urls]
Repository = "https://github.com/koorg/rdappy"
Documentation = "https://github.com/koorg/rdappy/blob/fr/README.md"
Issues = "https://github.com/koorg/rdappy/issues"

[tool.setuptools]
py-modules = ["rdappy"]
